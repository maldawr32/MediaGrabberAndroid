plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mediagrabber'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.mediagrabber'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'

    def youtubedlAndroid = '0.19.0'
    implementation "io.github.deniscerri.youtubedl-android:library:${youtubedlAndroid}"
    implementation "io.github.deniscerri.youtubedl-android:ffmpeg:${youtubedlAndroid}"
}
